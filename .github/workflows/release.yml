name: Release

# Tag a version to build all three platforms and publish to GitHub Releases
# (which the in-app auto-updater reads):
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Gate the publish on the same checks CI runs: a red tag must not ship to the
  # in-app auto-updater. Runs once on Linux; the platform builds wait on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axivale/package-lock.json
      - run: npm ci
        working-directory: axivale
      - run: npm run typecheck
        working-directory: axivale
      - run: npx vitest run --maxWorkers=2
        working-directory: axivale

  release:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axivale/package-lock.json
      - run: npm ci
        working-directory: axivale
      - run: npm run build
        working-directory: axivale
      # CSC_LINK is the APPLE cert — keep it off the windows runner, where
      # electron-builder would try to codesign the .exe with it and fail.
      - if: runner.os == 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os != 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Set the GitHub release body from RELEASE_NOTES.md and announce to Discord —
  # mirrors how AxiForge/AxiBridge ship. Runs once after all platforms publish.
  # Posts via the bot (DISCORD_BOT_TOKEN secret) to the DISCORD_RELEASE_CHANNEL_ID
  # Actions variable.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish release notes
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          notes=$(awk -v ver="$tag" '
            $0 ~ "^## Version " ver "( |$)" { capture=1; next }
            capture && /^## Version v/ { exit }
            capture { print }
          ' RELEASE_NOTES.md)

          # Fail loudly if RELEASE_NOTES.md has no section for this tag, rather
          # than publishing an empty body and a generic Discord post.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASE_NOTES.md section found for $tag. Add a '## Version $tag — <date>' entry and re-run." >&2
            exit 1
          fi

          # Match this tag's release whether electron-builder left it draft or live.
          # The PATCH is idempotent — it (re)writes the notes and ensures it's live.
          release_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!){
              repository(owner:$owner,name:$repo){
                releases(first:20,orderBy:{field:CREATED_AT,direction:DESC}){
                  nodes{ databaseId tagName isDraft }
                }
              }
            }' -F owner=darkharasho -F repo=axivale \
            --jq ".data.repository.releases.nodes[] | select(.tagName==\"$tag\") | .databaseId" | head -1)

          if [ -z "$release_id" ]; then
            echo "No release found for tag $tag (expected electron-builder to have created it)" >&2
            exit 1
          fi

          gh api -X PATCH "repos/darkharasho/axivale/releases/$release_id" \
            -f body="$notes" \
            -F draft=false

      - name: Announce on Discord
        if: ${{ vars.DISCORD_RELEASE_CHANNEL_ID != '' }}
        working-directory: axivale
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/post-discord-release.mjs "${{ vars.DISCORD_RELEASE_CHANNEL_ID }}" "${GITHUB_REF#refs/tags/}"
