name: Release

# Tag a version to build all three platforms and publish to GitHub Releases
# (which the in-app auto-updater reads):
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Gate the publish on the same checks CI runs: a red tag must not ship to the
  # in-app auto-updater. Runs once on Linux; the platform builds wait on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axivale/package-lock.json
      - run: npm ci
        working-directory: axivale
      - run: npm run typecheck
        working-directory: axivale
      - run: npx vitest run --maxWorkers=2
        working-directory: axivale

  release:
    needs: test
    strategy:
      # One platform's failure must not cancel the others. mac signing and
      # notarization depend on Apple-side state that can lapse (an expired
      # agreement returns 403 from notarytool); with fail-fast the windows build
      # got cancelled mid-flight and the release shipped linux-only.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axivale/package-lock.json
      - run: npm ci
        working-directory: axivale
      - run: npm run build
        working-directory: axivale
      # electron-builder's createKeychain() makes a temp keychain with a random
      # password, then runs `security set-key-partition-list -k` with the p12
      # password instead (app-builder-lib macCodeSign.js). macOS runner image
      # 20260828 (Darwin 25.6) enforces -k, so signing dies with
      # "SecKeychainUnlock: The user name or passphrase you entered is not correct".
      # Import the cert ourselves and hand electron-builder CSC_KEYCHAIN instead of
      # CSC_LINK, which skips that code path entirely.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
          keychain: signing_temp
      # electron-builder silently ad-hoc signs when it can't see an identity, which
      # only surfaces minutes later as a notarization rejection. Fail here instead.
      - name: Verify macOS signing identity is visible
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! security find-identity -v -p codesigning signing_temp.keychain | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity in signing_temp.keychain"
            security find-identity -v signing_temp.keychain
            exit 1
          fi
      # Without these electron-builder can't authenticate to Artifact Signing.
      # Fail before the slow build instead of after it.
      - name: Check the Windows signing secrets are set
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set."; exit 1; }
          done
      # The signing keychain is mac-only — keep it off the windows runner, where
      # electron-builder would try to codesign the .exe with it and fail.
      - if: runner.os == 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .keychain suffix required: `security find-identity` won't resolve a bare name.
          CSC_KEYCHAIN: signing_temp.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows is signed with Azure Artifact Signing instead (build.win.azureSignOptions
      # in package.json); electron-builder reads the AZURE_* credentials from the
      # environment. Linux ignores them.
      - if: runner.os != 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The installer is already published by now, but a red job flags an unsigned
      # build before anyone ships it further.
      - name: Verify the Windows installer is signed
        if: runner.os == 'Windows'
        working-directory: axivale
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -like '* Setup *.exe' }
          if (-not $files) { Write-Error "No installer found in release/"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

  # Set the GitHub release body from RELEASE_NOTES.md and announce to Discord —
  # mirrors how AxiForge/AxiBridge ship. Runs once after all platforms publish.
  # Posts via the bot (DISCORD_BOT_TOKEN secret) to the DISCORD_RELEASE_CHANNEL_ID
  # Actions variable.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish release notes
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          notes=$(awk -v ver="$tag" '
            $0 ~ "^## Version " ver "( |$)" { capture=1; next }
            capture && /^## Version v/ { exit }
            capture { print }
          ' RELEASE_NOTES.md)

          # Fail loudly if RELEASE_NOTES.md has no section for this tag, rather
          # than publishing an empty body and a generic Discord post.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASE_NOTES.md section found for $tag. Add a '## Version $tag — <date>' entry and re-run." >&2
            exit 1
          fi

          # Match this tag's release whether electron-builder left it draft or live.
          # The PATCH is idempotent — it (re)writes the notes and ensures it's live.
          release_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!){
              repository(owner:$owner,name:$repo){
                releases(first:20,orderBy:{field:CREATED_AT,direction:DESC}){
                  nodes{ databaseId tagName isDraft }
                }
              }
            }' -F owner=darkharasho -F repo=axivale \
            --jq ".data.repository.releases.nodes[] | select(.tagName==\"$tag\") | .databaseId" | head -1)

          if [ -z "$release_id" ]; then
            echo "No release found for tag $tag (expected electron-builder to have created it)" >&2
            exit 1
          fi

          gh api -X PATCH "repos/darkharasho/axivale/releases/$release_id" \
            -f body="$notes" \
            -F draft=false

      - name: Announce on Discord
        if: ${{ vars.DISCORD_RELEASE_CHANNEL_ID != '' }}
        working-directory: axivale
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/post-discord-release.mjs "${{ vars.DISCORD_RELEASE_CHANNEL_ID }}" "${GITHUB_REF#refs/tags/}"
