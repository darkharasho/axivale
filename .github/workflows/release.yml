name: Release

# Tag a version to build all three platforms and publish to GitHub Releases
# (which the in-app auto-updater reads):
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: axivale
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axivale/package-lock.json
      - run: npm ci
        working-directory: axivale
      - run: npm run build
        working-directory: axivale
      # CSC_LINK is the APPLE cert — keep it off the windows runner, where
      # electron-builder would try to codesign the .exe with it and fail.
      - if: runner.os == 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: runner.os != 'macOS'
        run: npx electron-builder --publish always
        working-directory: axivale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
